services:
  llm-chatbot:
    build:
      context: ./
      dockerfile: Dockerfile.local
    container_name: llm-chatbot
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ./configuration:/app/configuration
      - .:/app/.
    ports:
      - 3000:3000
    networks:
      - docker_net

  mongodb:
    image: mongo:7
    container_name: mongodb
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    restart: always
    env_file:
      - .env
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data/db
    networks:
      - docker_net

volumes:
  mongodb-data:

networks:
  docker_net:
    driver: bridge
